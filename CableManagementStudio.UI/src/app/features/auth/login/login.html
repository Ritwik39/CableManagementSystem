<div class="login-container">

    <h2>Login</h2>

    <div>

        <label>Username</label>

        <input
            type="text"
            [(ngModel)]="loginRequest.userName">

    </div>

    <br>

    <div>

        <label>Password</label>

        <input
            type="password"
            [(ngModel)]="loginRequest.password">

    </div>

    <br>

    <button (click)="login()">
        Login
    </button>

</div>
