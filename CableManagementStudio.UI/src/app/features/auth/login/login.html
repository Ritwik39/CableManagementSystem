<div class="login-page">

  <div class="login-card">

    <div class="brand">
      <h2>Cable Management System</h2>
      <p>Login or Register to continue</p>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button
        [class.active]="selectedTab === 'login'"
        (click)="changeTab('login')">
        Login
      </button>

      <button
        [class.active]="selectedTab === 'register'"
        (click)="changeTab('register')">
        Register
      </button>
    </div>

    <!-- ================= LOGIN ================= -->

    <div *ngIf="selectedTab === 'login'">

      <div class="form-group">
        <label>Username</label>

        <input
          type="text"
          placeholder="Enter Username"
          [(ngModel)]="username">
      </div>

      <div class="form-group">

        <label>Password</label>

        <div class="password-box">

          <input
            [type]="showLoginPassword ? 'text' : 'password'"
            placeholder="Enter Password"
            [(ngModel)]="password">

          <button
            type="button"
            class="eye-button"
            (click)="showLoginPassword = !showLoginPassword">

            {{ showLoginPassword ? 'Hide' : 'Show' }}

          </button>

        </div>

      </div>

      <div
        class="error"
        *ngIf="loginError">

        {{ loginError }}

      </div>

      <button
        class="login-button"
        (click)="login()"
        [disabled]="loading">

        {{ loading ? 'Signing In...' : 'Login' }}

      </button>

    </div>

    <!-- ================= REGISTER ================= -->

    <div *ngIf="selectedTab === 'register'">

      <div class="form-group">

        <label>Full Name</label>

        <input
          type="text"
          placeholder="Enter Full Name"
          [(ngModel)]="fullName">

      </div>

      <div class="form-group">

        <label>Username</label>

        <input
          type="text"
          placeholder="Choose Username"
          [(ngModel)]="registerUsername">

      </div>

      <div class="form-group">

        <label>Email</label>

        <input
          type="email"
          placeholder="Enter Email"
          [(ngModel)]="email">

      </div>

      <div class="form-group">

        <label>Password</label>

        <div class="password-box">

          <input
            [type]="showRegisterPassword ? 'text' : 'password'"
            placeholder="Create Password"
            [(ngModel)]="registerPassword">

          <button
            type="button"
            class="eye-button"
            (click)="showRegisterPassword=!showRegisterPassword">

            {{ showRegisterPassword ? 'Hide' : 'Show' }}

          </button>

        </div>

      </div>

      <div class="form-group">

        <label>Confirm Password</label>

        <div class="password-box">

          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            placeholder="Confirm Password"
            [(ngModel)]="confirmPassword">

          <button
            type="button"
            class="eye-button"
            (click)="showConfirmPassword=!showConfirmPassword">

            {{ showConfirmPassword ? 'Hide' : 'Show' }}

          </button>

        </div>

      </div>

      <div
        class="error"
        *ngIf="registerError">

        {{ registerError }}

      </div>

      <div
        class="success"
        *ngIf="registerSuccess">

        {{ registerSuccess }}

      </div>

      <button
        class="login-button"
        (click)="register()"
        [disabled]="loading">

        {{ loading ? 'Registering...' : 'Register' }}

      </button>

    </div>

  </div>

</div>
