<div class="package-form-container">
  <div class="form-header">
    <div>
      <h2>Add Package</h2>
      <p>Create a new cable package</p>
    </div>
  </div>

  <form (ngSubmit)="addPackage()">
    <div class="form-group">
      <label for="packageName"> Package Name </label>

      <input
        id="packageName"
        type="text"
        name="packageName"
        [(ngModel)]="package.packageName"
        placeholder="Enter package name"
        required
      />
    </div>

    <div class="form-group">
      <label for="price"> Price </label>

      <input
        id="price"
        type="number"
        name="price"
        [(ngModel)]="package.price"
        placeholder="Enter package price"
        min="1"
        required
      />
    </div>

    <div class="form-group">
      <label for="speedMbps"> Speed (Mbps) </label>

      <input
        id="speedMbps"
        type="number"
        name="speedMbps"
        [(ngModel)]="package.speedMbps"
        placeholder="Enter internet speed"
        min="1"
        required
      />
    </div>

    <div class="form-actions">
      <button type="button" class="cancel-btn" (click)="cancel()">Cancel</button>

      <button type="submit" class="save-btn" [disabled]="loading">
        {{ loading ? 'Saving...' : 'Save Package' }}
      </button>
    </div>
  </form>
</div>
