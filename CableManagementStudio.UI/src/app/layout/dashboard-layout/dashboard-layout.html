<div class="layout-container">

    <!-- Sidebar -->

    <aside class="sidebar"
           [class.collapsed]="sidebarCollapsed">

        <div class="logo">

            <h2 *ngIf="!sidebarCollapsed">
                CMS
            </h2>

            <h2 *ngIf="sidebarCollapsed">
                C
            </h2>

        </div>

        <ul class="menu">

            <li>

                <a
                    routerLink="/dashboard"
                    routerLinkActive="active">

                    <span class="icon">🏠</span>

                    <span *ngIf="!sidebarCollapsed">
                        Dashboard
                    </span>

                </a>

            </li>

            <li>

                <a
                    routerLink="/customers"
                    routerLinkActive="active">

                    <span class="icon">👥</span>

                    <span *ngIf="!sidebarCollapsed">
                        Customers
                    </span>

                </a>

            </li>

            <li>

                <a
                    routerLink="/packages"
                    routerLinkActive="active">

                    <span class="icon">📦</span>

                    <span *ngIf="!sidebarCollapsed">
                        Packages
                    </span>

                </a>

            </li>

            <li>

                <a
                    routerLink="/payments"
                    routerLinkActive="active">

                    <span class="icon">💳</span>

                    <span *ngIf="!sidebarCollapsed">
                        Payments
                    </span>

                </a>

            </li>

        </ul>

        <div class="sidebar-footer">

            <button
                class="logout-btn"
                (click)="logout()">

                🚪

                <span *ngIf="!sidebarCollapsed">
                    Logout
                </span>

            </button>

        </div>

    </aside>

    <!-- Main Content -->

    <div class="main-content">

        <!-- Topbar -->

        <header class="topbar">

            <button
                class="toggle-btn"
                (click)="toggleSidebar()">

                ☰

            </button>

            <div class="topbar-title">

                Cable Management Studio

            </div>

            <div class="user-info">

                Welcome,
                <strong>

                    {{ fullName || username }}

                    </strong>

            </div>

        </header>

        <!-- Routed Page -->

        <main class="page-content">

            <router-outlet></router-outlet>

        </main>

    </div>

</div>
