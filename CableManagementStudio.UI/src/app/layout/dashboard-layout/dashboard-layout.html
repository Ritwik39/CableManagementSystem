<!-- Sidebar -->

<aside class="sidebar" [class.collapsed]="sidebarCollapsed">
  <div class="logo">
    <h2 *ngIf="!sidebarCollapsed">CMS</h2>

    <h2 *ngIf="sidebarCollapsed">C</h2>
  </div>

  <ul class="menu">
    <!-- Dashboard -->

    <li>
      <a routerLink="/dashboard" routerLinkActive="active">
        <span class="icon">🏠</span>

        <span *ngIf="!sidebarCollapsed"> Dashboard </span>
      </a>
    </li>

    <!-- My Profile - Customer Only -->

    <li *ngIf="role === 'Customer'">
      <a routerLink="/my-profile" routerLinkActive="active">
        <span class="icon">👤</span>

        <span *ngIf="!sidebarCollapsed"> My Profile </span>
      </a>
    </li>

    <!-- Customers - Admin / Employee Only -->

    <li *ngIf="role === 'Admin' || role === 'Employee'">
      <a routerLink="/customers" routerLinkActive="active">
        <span class="icon">👥</span>

        <span *ngIf="!sidebarCollapsed"> Customers </span>
      </a>
    </li>

    <!-- Packages - Admin / Employee Only -->

    <li *ngIf="role === 'Admin' || role === 'Employee'">
      <a routerLink="/packages" routerLinkActive="active">
        <span class="icon">📦</span>

        <span *ngIf="!sidebarCollapsed"> Packages </span>
      </a>
    </li>

    <!-- Payments - Admin / Employee Only -->

    <li *ngIf="role === 'Admin' || role === 'Employee'">
      <a routerLink="/payments" routerLinkActive="active">
        <span class="icon">💳</span>

        <span *ngIf="!sidebarCollapsed"> Payments </span>
      </a>
    </li>
  </ul>

  <!-- Sidebar Footer -->

  <div class="sidebar-footer">
    <button class="logout-btn" (click)="logout()">
      🚪

      <span *ngIf="!sidebarCollapsed"> Logout </span>
    </button>
  </div>
</aside>

<!-- Main Content -->

<div class="main-content">
  <!-- Topbar -->

  <header class="topbar">
    <button class="toggle-btn" (click)="toggleSidebar()">☰</button>

    <div class="topbar-title">Cable Management Studio</div>

    <div class="user-info">
      Welcome,

      <strong>
        {{ fullName || username }}
      </strong>
    </div>
  </header>

  <!-- Routed Page -->

  <main class="page-content">
    <router-outlet></router-outlet>
  </main>
</div>
